[project]
name = "rnp-backend"
version = "0.45.1"
description = "RNP (Hand on the Pulse) for Wildberries — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx[http2]>=0.28",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-multipart>=0.0.20",
    "cryptography>=44.0",
    "bcrypt>=4.2",
    "pyjwt>=2.10",
    "tenacity>=9.0",
    "orjson>=3.10",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-mock>=3.14",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
