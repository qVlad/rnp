# Fallback цепочка для X-Forwarded-Proto:
# если внешний proxy выставил заголовок — используем его, иначе $scheme.
map $http_x_forwarded_proto $upstream_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Multipart upload limit для A/B-фото и видео-вариантов карточки.
    # WB Content media принимает до ~32 МБ фото и ~50 МБ видео; запас на
    # multipart overhead. Default nginx = 1 МБ → upload 413 без этого.
    client_max_body_size 300m;

    # Docker's embedded DNS server. The `valid=` ensures nginx re-resolves
    # the `backend` hostname periodically — without this, nginx caches the
    # upstream IP at startup, and when backend container restarts and gets
    # a new IP, the frontend keeps proxying to the old (now non-existent)
    # address until you restart frontend too.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # Use a variable so nginx honours the resolver TTL on every request
        # instead of caching the IP forever.
        set $backend_upstream "http://backend:8000";
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto: если внешний Caddy уже выставил его (https/http) —
        # пробрасываем как есть; если нет — берём $scheme nginx'а (HTTP внутри
        # docker network). uvicorn с --proxy-headers это распарсит и установит
        # request.url.scheme правильно — критично для AUTH_COOKIE_SECURE.
        proxy_set_header X-Forwarded-Proto $upstream_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    # Hashed assets — immutable, кешируем долго (filename меняется при rebuild).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html и SPA-fallback — НЕ кешировать. Иначе пользователи зависают
    # на старом index.html → ссылка на старый assets/index-XXX.js, фиксы в
    # новом bundle до них не доезжают пока не сделают Ctrl+Shift+R.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
