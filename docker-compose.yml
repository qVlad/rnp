name: rnp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: rnp
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d rnp"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    image: rnp-app:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"

  worker-stats:
    image: rnp-app:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # IMPORTANT: concurrency=1 here. WB Statistics rate limit is per-token, not
    # per-process — multiple parallel processes would multiply the request rate.
    command: celery -A app.sync.celery_app:celery_app worker -Q stats -n stats@%h -l info -c 1

  worker-advert:
    image: rnp-app:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.sync.celery_app:celery_app worker -Q advert -n advert@%h -l info -c 1

  worker-default:
    image: rnp-app:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.sync.celery_app:celery_app worker -Q default -n default@%h -l info -c 2

  beat:
    image: rnp-app:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    command: celery -A app.sync.celery_app:celery_app beat -l info

  bot:
    image: rnp-app:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    command: python -m app.bot.main

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
