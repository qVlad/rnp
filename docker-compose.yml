name: rnp

# Production-ready compose. Frontend nginx exposed on host:4098 (matches the
# external port forward 4098 → 192.168.31.61:4098).
# Backend, postgres, redis — internal-only, недоступны снаружи docker network.
#
# До запуска:
#   1. Создай `.env` на основе `.env.example` (важно: WB_TOKEN, JWT_SECRET_KEY).
#   2. `docker compose up -d --build`
#   3. Открой `http://<host>:4098/` — там Bootstrap-форма первого админа
#      (если ни одного юзера ещё нет; иначе обычный логин).
#
# Логи:
#   docker compose logs -f backend frontend beat worker-stats

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: rnp
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d rnp"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    image: rnp-app:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"
    # No host port mapping — frontend nginx proxies /api/* to backend:8000
    # via docker internal network. Backend stays out of the public internet.
    expose:
      - "8000"
    volumes:
      # A/B-test photo variants (multipart uploads from API, read by rotation
      # worker). Same volume mounted on worker-default below.
      - abtest_photos:/app/storage/photos

  worker-stats:
    image: rnp-app:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # IMPORTANT: concurrency=1 here. WB Statistics rate limit is per-token, not
    # per-process — multiple parallel processes would multiply the request rate.
    command: celery -A app.sync.celery_app:celery_app worker -Q stats -n stats@%h -l info -c 1
    # Graceful shutdown: SIGTERM → warm shutdown (дождаться текущей задачи)
    # → SIGKILL только через 30 мин. report_detail backfill за весь год может
    # идти ~50 мин, но он попадает в очередь stats и обычно длится 5-15 мин.
    # Если задача всё-таки не успеет: acks_late + reject_on_worker_lost вернут
    # её в очередь, новый worker подберёт.
    stop_grace_period: 1800s
    stop_signal: SIGTERM

  worker-advert:
    image: rnp-app:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.sync.celery_app:celery_app worker -Q advert -n advert@%h -l info -c 1
    stop_grace_period: 1800s
    stop_signal: SIGTERM

  worker-default:
    image: rnp-app:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.sync.celery_app:celery_app worker -Q default -n default@%h -l info -c 2
    stop_grace_period: 1800s
    stop_signal: SIGTERM
    volumes:
      # rotation worker читает фото-варианты при ротации (POST /content/v3/media/file)
      - abtest_photos:/app/storage/photos

  beat:
    image: rnp-app:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    command: celery -A app.sync.celery_app:celery_app beat -l info

  bot:
    image: rnp-app:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    command: python -m app.bot.main

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    # 4098 — внешний порт (= внутренний на сервере), на него настроен port forward
    # 4098 → 192.168.31.61:4098 в роутере 94.198.130.185.
    ports:
      - "4098:80"

volumes:
  pgdata:
  abtest_photos:
